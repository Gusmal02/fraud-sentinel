name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Bandit security check
        run: uv run --with bandit bandit -r agent/ api/ classifier/ llm/ document_intelligence/ -ll

      - name: Run tests
        run: uv run pytest tests/ -v